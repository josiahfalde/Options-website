<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b12" />
    <meta
      name="description"
      content="Flywheel - Wheel-strategy options premium analytics. Your broker shows trades; Flywheel shows momentum."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Flywheel — Options Premium Analytics</title>
    <!-- Apply the saved/preferred theme BEFORE first paint to avoid a flash
         of the wrong theme. Mirrors the logic in src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("flywheel-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          var root = document.documentElement;
          root.classList.add(theme);
          root.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "light" ? "#f1f5f9" : "#080b12");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DrW_rSEP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DbcZHdhv.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
